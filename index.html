<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sổ S2a-HKD</title>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 15px; background: #f5f5f5; color: #333; }
.container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
h1 { font-size: 20px; margin-top: 0; color: #1a73e8; text-align: center; }
.toolbar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
button { padding: 8px 16px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
button:hover { background: #1557b0; }
button.btn-danger { background: #dc3545; }
button.btn-danger:hover { background: #bd2130; }
button.btn-success { background: #28a745; }
button.btn-success:hover { background: #218838; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
th { background-color: #f2f2f2; font-weight: 600; }
input[type="text"], input[type="number"], input[type="date"] { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
.text-center { text-align: center; }
.text-right { text-align: right; }
</style>
</head>
<body>

<div class="container">
    <h1>SỔ CHI TIẾT DOANH THU BÁN HÀNG HÓA, DỊCH VỤ (Sổ S2a-HKD)</h1>
    
    <div class="toolbar">
        <button onclick="addRow()">+ Thêm dòng</button>
        <button class="btn-success" onclick="exportToExcel()">Xuất Excel</button>
        <button class="btn-danger" onclick="clearAllData()">Xóa tất cả dữ liệu</button>
    </div>

    <table id="dataTable">
        <thead>
            <tr>
                <th style="width: 50px;">STT</th>
                <th style="width: 120px;">Ngày tháng</th>
                <th style="width: 150px;">Số hiệu chứng từ</th>
                <th>Diễn giải</th>
                <th style="width: 150px;">Doanh thu (VNĐ)</th>
                <th style="width: 80px;">Thao tác</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Dữ liệu được tải từ localStorage -->
        </tbody>
    </table>
</div>

<script>
let rowCount = 0;

// Tải dữ liệu lưu sẵn khi mở trang
window.onload = function() {
    loadData();
};

function addRow(data = {}) {
    rowCount++;
    const tbody = document.getElementById('tableBody');
    const tr = document.createElement('tr');
    
    tr.innerHTML = `
        <td class="text-center row-stt">${rowCount}</td>
        <td><input type="date" class="row-date" value="${data.date || ''}" onchange="saveData()"></td>
        <td><input type="text" class="row-doc" value="${data.doc || ''}" onchange="saveData()"></td>
        <td><input type="text" class="row-desc" value="${data.desc || ''}" onchange="saveData()"></td>
        <td><input type="number" class="row-amount text-right" value="${data.amount || ''}" onchange="saveData()"></td>
        <td class="text-center"><button class="btn-danger" onclick="deleteRow(this)">Xóa</button></td>
    `;
    
    tbody.appendChild(tr);
    saveData();
}

function deleteRow(btn) {
    const tr = btn.closest('tr');
    tr.remove();
    updateSTT();
    saveData();
}

function updateSTT() {
    const rows = document.querySelectorAll('#tableBody tr');
    rowCount = 0;
    rows.forEach((row, index) => {
        rowCount = index + 1;
        row.querySelector('.row-stt').innerText = rowCount;
    });
}

function saveData() {
    const rows = document.querySelectorAll('#tableBody tr');
    const data = [];
    
    rows.forEach(row => {
        data.push({
            date: row.querySelector('.row-date').value,
            doc: row.querySelector('.row-doc').value,
            desc: row.querySelector('.row-desc').value,
            amount: row.querySelector('.row-amount').value
        });
    });
    
    localStorage.setItem('S2a_HKD_Data', JSON.stringify(data));
}

function loadData() {
    const saved = localStorage.getItem('S2a_HKD_Data');
    if (saved) {
        const data = JSON.parse(saved);
        if (data.length > 0) {
            data.forEach(item => addRow(item));
            return;
        }
    }
    // Dòng mặc định nếu chưa có dữ liệu
    addRow();
}

function clearAllData() {
    if (confirm("Bạn có chắc chắn muốn xóa toàn bộ dữ liệu không?")) {
        localStorage.removeItem('S2a_HKD_Data');
        document.getElementById('tableBody').innerHTML = '';
        rowCount = 0;
        addRow();
    }
}

function exportToExcel() {
    let csv = "\uFEFF"; // UTF-8 BOM
    csv += "STT,Ngày tháng,Số hiệu chứng từ,Diễn giải,Doanh thu (VNĐ)\n";
    
    const rows = document.querySelectorAll('#tableBody tr');
    rows.forEach(row => {
        const stt = row.querySelector('.row-stt').innerText;
        const date = row.querySelector('.row-date').value;
        const doc = `"${row.querySelector('.row-doc').value.replace(/"/g, '""')}"`;
        const desc = `"${row.querySelector('.row-desc').value.replace(/"/g, '""')}"`;
        const amount = row.querySelector('.row-amount').value;
        
        csv += `${stt},${date},${doc},${desc},${amount}\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", "So_S2a_HKD.csv");
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>
</body>
</html>
